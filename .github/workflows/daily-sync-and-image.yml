name: daily-sync-and-image

# 上游自动同步 + 每日构建镜像并推送 ghcr.io
# 说明：push 与 schedule 都走同一套流程；构建和同步放在同一个 workflow 里，
# 因为用 GITHUB_TOKEN 推送到 main 不会触发另一个 workflow（防递归），分开写会断链。

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"      # UTC 19:00 = 北京时间 03:00，每天一次
  workflow_dispatch:           # 支持手动点按钮

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write              # 拉取上游后要 push 回自己的 main
  packages: write              # 推镜像到 ghcr.io
  issues: write                # 冲突时建 issue 提醒

env:
  UPSTREAM_REPO: KKKKhazix/AIHOT
  UPSTREAM_BRANCH: main

jobs:
  # ---------- 1. 合并上游 ----------
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 显式写分支名：schedule 触发时 github.sha 是同步前的旧提交
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并上游
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --prune upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          HEAD_SHA=$(git rev-parse HEAD)
          UP_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "本地 HEAD : $HEAD_SHA"
          echo "上游 HEAD : $UP_SHA"

          if [ "$HEAD_SHA" = "$UP_SHA" ] || git merge-base --is-ancestor "$UP_SHA" HEAD; then
            echo "已是最新，无需合并"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "合并成功"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "存在冲突，已放弃本次合并（main 保持不变）"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送合并结果
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:main"

      - name: 冲突时开 issue（不重复开）
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "上游同步冲突：需要手动处理"
        run: |
          COUNT=$(gh issue list --state open --search "上游同步冲突 in:title" --json number --jq 'length')
          if [ "$COUNT" != "0" ]; then
            echo "已有未关闭的冲突 issue，跳过"
            exit 0
          fi
          BODY=$(cat <<'EOF'
          自动合并 `upstream/main` 时出现冲突，本次已 abort，`main` 没有被改动（镜像仍是上一次可用代码）。

          本地处理：

          ```bash
          git fetch upstream && git merge upstream/main
          # 解决冲突、测试通过后
          git push origin main
          ```

          推上去会自动触发新的构建，处理完可以关掉这个 issue。
          EOF
          )
          gh issue create --title "$TITLE" --body "$BODY"

  # ---------- 2. 构建并推送镜像 ----------
  build:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 拿到 sync job 刚推上去的新提交

      # GHCR 要求镜像名全小写，而仓库名是 AIHOT，必须转小写
      - name: 计算镜像名
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 tag 和 label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-{{date 'YYYYMMDD'}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true                     # 每天都拉一次 node:24-trixie-slim，跟进基础镜像安全更新
          platforms: linux/amd64         # 需要 arm64 就改成 linux/amd64,linux/arm64（会慢很多）
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY }}

      - name: 写入任务摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "上游同步：${{ needs.sync.outputs.conflict == 'true' && '**有冲突，已跳过合并**' || '正常' }}"
          } >> "$GITHUB_STEP_SUMMARY"
